# ==============================================================================
# SGBA — Profile dev: PostgreSQL local subido via `docker compose up -d`
# (credenciais/credenciais do compose: db=sgba, user=sgba, senha=sgba, porta 5432)
# ==============================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/sgba
spring.datasource.username=sgba
spring.datasource.password=sgba

# D5 — ddl-auto=update aceito para o checkpoint (Flyway fica para depois)
spring.jpa.hibernate.ddl-auto=update

# Evidência de SQL em dev (demonstração do Checkpoint 3)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

