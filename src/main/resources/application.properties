# ==============================================================================
# SGBA — Configurações comuns a todos os profiles
# Profiles disponíveis: dev (PostgreSQL local via compose.yaml) | test (H2 in-memory)
# Ativar: --spring.profiles.active=dev (ou -Dspring-boot.run.profiles=dev)
# ==============================================================================

spring.application.name=SGBA

# D7 — Armazenamento de arquivos (RNF06): diretório local configurável.
# Entidades gravam caminho relativo a este diretório (upload em Issues 4 e 6).
sgba.storage.dir=./storage

# Issue 4 — upload do PDF do edital (D7): limite do Spring alinhado ao limite do service (10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
sgba.storage.edital-max-bytes=10485760
