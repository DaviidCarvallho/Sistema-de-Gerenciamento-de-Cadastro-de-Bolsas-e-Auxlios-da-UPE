# ==============================================================================
# SGBA — Profile test: H2 in-memory (usado pelo `./mvnw test`)
# Driver, usuário/senha e dialecto JPA são auto-configurados a partir da URL H2.
# ==============================================================================

spring.datasource.url=jdbc:h2:mem:sgba;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
