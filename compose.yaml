# Checkpoint 3 — Issue 1 (Fundação)
# Banco PostgreSQL para o profile `dev`.
# Uso:  docker compose up -d   (bancos criados em volume, sobrevive a restarts)
services:
  db:
    image: postgres:16
    container_name: sgba-postgres
    environment:
      POSTGRES_DB: sgba
      POSTGRES_USER: sgba
      POSTGRES_PASSWORD: sgba
    ports:
      - "5432:5432"
    volumes:
      - sgba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgba -d sgba"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sgba_pgdata:
